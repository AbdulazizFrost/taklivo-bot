<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e3b5" />
      <stop offset="30%" stop-color="#c9a96e" />
      <stop offset="70%" stop-color="#e3cda0" />
      <stop offset="100%" stop-color="#a9835a" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfb" />
      <stop offset="100%" stop-color="#f8efe8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" />

  <!-- Outer Fine Ornate Rings -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="154" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />

  <!-- Top Crown / Arch Flourish -->
  <g transform="translate(200, 75)" stroke="url(#goldGrad)" fill="none" stroke-width="1.8" stroke-linecap="round">
    <path d="M-25,10 C-15,-10 0,-15 0,-15 C0,-15 15,-10 25,10" />
    <circle cx="0" cy="-18" r="3.5" fill="url(#goldGrad)" />
    <circle cx="-25" cy="10" r="2.5" fill="url(#goldGrad)" />
    <circle cx="25" cy="10" r="2.5" fill="url(#goldGrad)" />
    <path d="M-12,2 Q0,-6 12,2" />
  </g>

  <!-- Side Laurel Branches -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.5" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M60,200 C60,130 110,85 150,75" />
    <path d="M65,175 Q75,170 70,160" />
    <path d="M78,145 Q90,142 85,130" />
    <path d="M100,115 Q115,112 110,100" />
    <path d="M125,95 Q140,90 135,80" />

    <!-- Right Leaves -->
    <path d="M340,200 C340,130 290,85 250,75" />
    <path d="M335,175 Q325,170 330,160" />
    <path d="M322,145 Q310,142 315,130" />
    <path d="M300,115 Q285,112 290,100" />
    <path d="M275,95 Q260,90 265,80" />
  </g>

  <!-- Bottom Flourish Ribbon -->
  <g transform="translate(200, 325)" stroke="url(#goldGrad)" fill="none" stroke-width="1.8" stroke-linecap="round">
    <path d="M-60,-5 C-30,18 30,18 60,-5" />
    <circle cx="0" cy="12" r="3" fill="url(#goldGrad)" />
    <path d="M-35,6 Q0,22 35,6" opacity="0.6" />
  </g>

  <!-- Center Intertwined Monogram A & M -->
  <text x="160" y="235" font-family="'Parisienne', 'Playfair Display', serif" font-size="110" font-weight="600" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" filter="url(#softGlow)">A</text>
  <text x="200" y="215" font-family="'Parisienne', 'Playfair Display', serif" font-size="45" font-weight="400" fill="url(#goldGrad)" text-anchor="middle" opacity="0.75">&amp;</text>
  <text x="240" y="240" font-family="'Parisienne', 'Playfair Display', serif" font-size="110" font-weight="600" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" filter="url(#softGlow)">M</text>

  <!-- Small Diamond Accent beneath -->
  <polygon points="200,270 205,275 200,280 195,275" fill="url(#goldGrad)" />
</svg>
