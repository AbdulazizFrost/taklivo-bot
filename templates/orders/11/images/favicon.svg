<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbeecb"/>
      <stop offset="40%" stop-color="#dfc488"/>
      <stop offset="80%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#9a7645"/>
    </linearGradient>
    <filter id="shadowFavicon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Background for dark & light browser tabs -->
  <rect width="64" height="64" rx="16" fill="#251e19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldFavicon)" stroke-width="1.5" opacity="0.75"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#goldFavicon)" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Golden Heart with Glowing Crown -->
  <path d="M32 46.5C32 46.5 16 37 16 26C16 20.8 20.2 17 25 17C28.2 17 30.8 18.6 32 21C33.2 18.6 35.8 17 39 17C43.8 17 48 20.8 48 26C48 37 32 46.5 32 46.5Z" 
        fill="url(#goldFavicon)" filter="url(#shadowFavicon)"/>

  <!-- Top delicate crown dot -->
  <circle cx="32" cy="11.5" r="2.5" fill="url(#goldFavicon)"/>
</svg>
