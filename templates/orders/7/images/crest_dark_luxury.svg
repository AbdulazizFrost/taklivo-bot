<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6" />
      <stop offset="25%" stop-color="#e2bf7d" />
      <stop offset="70%" stop-color="#f8e6c4" />
      <stop offset="100%" stop-color="#a47c3e" />
    </linearGradient>
    <radialGradient id="darkDiscGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f2533" />
      <stop offset="60%" stop-color="#10131a" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Velvet Disc -->
  <circle cx="200" cy="200" r="185" fill="url(#darkDiscGrad)" />

  <!-- Outer Cartier Fine Gold Rims -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="200" cy="200" r="174" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.75" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="200" cy="200" r="154" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />

  <!-- Cardinal Star Compass Accent Points (Top, Bottom, Left, Right) -->
  <polygon points="200,30 204,36 200,42 196,36" fill="url(#goldGrad)" />
  <polygon points="200,358 204,364 200,370 196,364" fill="url(#goldGrad)" />
  <polygon points="30,200 36,196 42,200 36,204" fill="url(#goldGrad)" />
  <polygon points="370,200 364,196 358,200 364,204" fill="url(#goldGrad)" />

  <!-- Top Crown / Royal Tiara Crest -->
  <g transform="translate(200, 80)" stroke="url(#goldGrad)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-32,14 L-22,-8 L0,-1 L22,-8 L32,14 Z" />
    <circle cx="0" cy="-5" r="3" fill="url(#goldGrad)" />
    <circle cx="-22" cy="-12" r="2.5" fill="url(#goldGrad)" />
    <circle cx="22" cy="-12" r="2.5" fill="url(#goldGrad)" />
    <circle cx="-32" cy="14" r="2" fill="url(#goldGrad)" />
    <circle cx="32" cy="14" r="2" fill="url(#goldGrad)" />
    <path d="M-16,5 Q0,-1 16,5" />
  </g>

  <!-- Laurel Wreath Flourish Leaves -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.6" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M72,210 C70,140 115,95 152,86" />
    <path d="M76,188 Q88,184 84,172" />
    <path d="M88,158 Q100,154 96,142" />
    <path d="M108,130 Q122,126 118,114" />
    <path d="M132,106 Q146,102 142,90" />

    <!-- Right Wreath -->
    <path d="M328,210 C330,140 285,95 248,86" />
    <path d="M324,188 Q312,184 316,172" />
    <path d="M312,158 Q300,154 304,142" />
    <path d="M292,130 Q278,126 282,114" />
    <path d="M268,106 Q254,102 258,90" />
  </g>

  <!-- Bottom Cartier Ribbon Tie -->
  <g transform="translate(200, 318)" stroke="url(#goldGrad)" fill="none" stroke-width="1.8" stroke-linecap="round">
    <path d="M-50,-2 C-25,16 25,16 50,-2" />
    <circle cx="0" cy="11" r="3" fill="url(#goldGrad)" />
    <path d="M-30,8 Q0,20 30,8" opacity="0.6" />
  </g>

  <!-- Center Luxury Monogram: M & O -->
  <text x="154" y="235" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="100" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">M</text>
  <text x="200" y="216" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="44" font-style="italic" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" opacity="0.85">&amp;</text>
  <text x="246" y="235" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="100" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">O</text>

  <!-- Elegant Diamond Dot beneath -->
  <polygon points="200,260 206,266 200,272 194,266" fill="url(#goldGrad)" />
</svg>
